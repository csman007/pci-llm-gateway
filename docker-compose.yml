services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: pci_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d pci_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./models.yaml:/app/models.yaml

volumes:
  pgvector_data:

  model: claude-haiku-4-5-20251001
  expected_requirement_ids:
    - "1.3.2"
  expected_keywords:
    - "inbound"
    - "traffic"
    - "cardholder"
  quality_criteria: "Must cite a Req 1.x and describe inbound/outbound traffic restrictions for the CDE"

- id: rag_007

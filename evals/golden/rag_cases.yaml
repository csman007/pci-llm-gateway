# RAG golden dataset — 20 cases covering major PCI DSS v4.0.1 requirement areas.
#
# expected_requirement_ids: the requirement IDs the answer MUST cite.
# expected_keywords:        substrings that must appear in a correct answer.
# quality_criteria:         human-readable description of what a correct answer looks like.

- id: rag_001
  question: "How long must audit logs be retained?"
  model: claude-haiku-4-5-20251001
  expected_requirement_ids:
    - "10.5.1"
  expected_keywords:
    - "12 months"
    - "retain"
  quality_criteria: "Must cite Req 10.5.1 and specify 12-month retention with 3 months immediately available"

- id: rag_002
  question: "How must primary account numbers be protected when stored?"
  model: claude-haiku-4-5-20251001
  expected_requirement_ids:
    - "3.5.1"
  expected_keywords:
    - "unreadable"
    - "strong cryptography"
  quality_criteria: "Must cite Req 3.5.1 and specify that PAN must be rendered unreadable using strong cryptography"

- id: rag_003
  question: "Is it permitted to store CVV codes after payment authorisation?"
  model: claude-haiku-4-5-20251001
  expected_requirement_ids:
    - "3.3.1"
  expected_keywords:
    - "not store"
    - "after"
    - "authorization"
  quality_criteria: "Must cite Req 3.3.1 and state that sensitive authentication data must not be stored after authorisation"

- id: rag_004
  question: "What cryptographic protocols are required for data in transit over open networks?"
  model: claude-haiku-4-5-20251001
  expected_requirement_ids:
    - "4.2.1"
  expected_keywords:
    - "strong cryptography"
    - "open"
    - "public network"
  quality_criteria: "Must cite Req 4.2.1 and require strong cryptography and security protocols for open/public networks"

- id: rag_005
  question: "How frequently must security vulnerabilities in software be addressed?"
  model: claude-haiku-4-5-20251001
  expected_requirement_ids:
    - "6.3.3"
  expected_keywords:
    - "security patch"
    - "vulnerabilit"
  quality_criteria: "Must cite Req 6.3.3 and describe patching timelines for critical vs non-critical vulnerabilities"

- id: rag_006
